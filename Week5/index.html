<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="Stylesheet" href="styles.css">
    <script>
       //Why JS? 
       //HTML which is structure, CSS which is style, 
       //JS, which is behavior(interactivity,logic,data
       //JS runs directly in the browser, we do not need any extra just yet

        //using inside the script tags, which is what we will use during the lab 


        //USING external JS looks like this

        console.log("This is my first log");
        console.log(5+10);
        //Variables: Containers for storing data
        //let: reassignable
        //const: permanent

        // let variableName=Value
        let name="Sebastian"; //string
        let age=25; //number
        const isInstructor=true; //boolean 
        //whenever we want output to the console, we will console.log
        console.log(name, age, isInstructor)

        //DATA Types
        //string: text in quotes "hello"
        //number: 5,6,35,4
        //Boolean: True or False Value 


        //MATH in JS 
        // +,-,*,/
        let x=5;
        let y=10;
        let total=x+y;
        console.log("Total is: "+total);
         

        //STRING
        //Strings can be combined, this is called concatenation 
        let first="Hello";
        let seconds="World!";
        console.log(first+" "+seconds)
        
    </script>
    <title>Document</title>
</head>

</body>
</html>
